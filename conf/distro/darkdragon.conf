#@TYPE: Distribution
#@NAME: DarkDragon OS
#@DESCRIPTION: Project distribution policy for DarkDragon Raspberry Pi images.

require conf/distro/poky.conf

DISTRO_NAME = "DarkDragon OS"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "kirkstone-rpi"
DISTROOVERRIDES =. "darkdragon:"

# Project-wide policy belongs in the distro, not in build-local config.
PACKAGE_CLASSES ?= "package_rpm"
INIT_MANAGER = "systemd"
USER_CLASSES ?= "buildstats"

DISTRO_FEATURES:append = " systemd usrmerge wifi bluetooth ipv4 ipv6"

VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""
