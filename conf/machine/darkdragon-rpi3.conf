#@TYPE: Machine
#@NAME: DarkDragon Raspberry Pi 3 Custom Board
#@DESCRIPTION: Custom board profile for the DarkDragon product based on Raspberry Pi 3 hardware.

# Start from the closest vendor-supported board and override only the parts
# owned by this project. This keeps BSP updates manageable.
require conf/machine/raspberrypi3.conf

MACHINEOVERRIDES =. "darkdragon-rpi3:myproject-rpi:raspberrypi3:"

# Board-level capabilities exposed to the rest of the distro and recipes.
MACHINE_FEATURES += "wifi bluetooth usbgadget"

# Keep serial console available for bring-up, recovery, and field diagnostics.
ENABLE_UART = "1"
SERIAL_CONSOLES ?= "115200;ttyS0"

# Stick to the vendor defconfig until the project needs a dedicated kernel config.
KBUILD_DEFCONFIG ?= "bcm2709_defconfig"

# Use the project DTB so board-level wiring lives in this layer, not in local config.
RPI_KERNEL_DEVICETREE = "darkdragon-rpi3.dtb"

# Keep artifact type aligned with the current flashing flow.
IMAGE_FSTYPES ?= "wic.bz2"
WKS_FILE ?= "darkdragon.wks"

MACHINE_EXTRA_RRECOMMENDS += " \
    linux-firmware-rpidistro-bcm43430 \
    linux-firmware-rpidistro-bcm43455 \
    bluez-firmware-rpidistro-bcm43430a1-hcd \
    bluez-firmware-rpidistro-bcm4345c0-hcd \
"
