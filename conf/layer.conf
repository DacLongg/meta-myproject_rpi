# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-myproject_rpi"
BBFILE_PATTERN_meta-myproject_rpi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-myproject_rpi = "6"

LAYERDEPENDS_meta-myproject_rpi = "core"
LAYERSERIES_COMPAT_meta-myproject_rpi = "kirkstone"
